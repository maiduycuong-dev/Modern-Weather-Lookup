<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather Lookup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body class="theme-default">

    <div class="weather-card">
        <div class="header-container">
            <h2 id="cardTitle">Check the Weather</h2>
            <button id="settingsBtn" title="Interface Settings">⚙️</button>
        </div>

        <div id="settingsPanel" class="settings-panel hidden">
            <div class="setting-group">
                <h4 id="labelTheme">Background Theme</h4>
                <div class="theme-options">
                    <button class="theme-btn" data-theme="default" style="background: linear-gradient(135deg, #00c6ff, #0072ff);" title="Blue"></button>
                    <button class="theme-btn" data-theme="sunset" style="background: linear-gradient(135deg, #f857a6, #ff5858);" title="Sunset"></button>
                    <button class="theme-btn" data-theme="emerald" style="background: linear-gradient(135deg, #11998e, #38ef7d);" title="Emerald"></button>
                    <button class="theme-btn" data-theme="dark" style="background: linear-gradient(135deg, #232526, #414345);" title="Dark"></button>
                    <button class="theme-btn" data-theme="sunshine" style="background: linear-gradient(135deg, #f7b733, #fc4a1a);" title="Sunshine"></button>
                </div>
            </div>

            <div class="setting-group" style="margin-top: 12px;">
                <h4 id="labelFont">Fonts Theme</h4>
                <div class="font-options">
                    <button class="font-btn active" data-font="segoe">Segoe UI</button>
                    <button class="font-btn" data-font="inter">Inter</button>
                    <button class="font-btn" data-font="roboto">Roboto</button>
                    <button class="font-btn" data-font="helvetica">Helvetica</button>
                </div>
            </div>

            <div class="setting-group" style="margin-top: 12px;">
                <h4 id="labelUnit">Temperature Unit</h4>
                <div class="unit-options">
                    <button class="unit-btn active" data-unit="C">°C</button>
                    <button class="unit-btn" data-unit="F">°F</button>
                </div>
            </div>

            <div class="setting-group" style="margin-top: 12px;">
                <h4 id="labelLang">Languages</h4>
                <div class="lang-options">
                    <button class="lang-btn active" data-lang="en">English</button>
                    <button class="lang-btn" data-lang="zh">中文</button>
                    <button class="lang-btn" data-lang="vi">Tiếng Việt</button>
                </div>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="history-trigger-box">
            <button id="historyModalBtn" class="history-trigger-btn">📅 Select past weather date</button>
        </div>

        <div id="loadingMsg" class="loading hidden">Loading Regional Weather Data Now...</div>
        <div id="errorMsg" class="error hidden">City Not Found or Network Error!</div>

        <div id="weatherResult" class="hidden">
            <div id="cityName" style="font-size: 20px; font-weight: 600; color: #111; margin-bottom: 5px;"></div>
            <span id="localTime" class="local-time"></span>
            
            <div class="temp-box">
                <span id="temp">--</span><span class="unit" id="unitSymbol">°C</span>
            </div>
            
            <div id="description">--</div>
            
            <div class="details">
                <div><span id="labelHumidity">Humidity</span>: <span id="humidity">--</span>%</div>
                <div><span id="labelWind">Wind</span>: <span id="wind">--</span> m/s</div>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="labelHistoryTitle">Select Past Date</h3>
                <button class="close-modal-btn" id="closeHistoryBtn">✕</button>
            </div>
            
            <div class="modal-body">
                <div class="custom-calendar">
                    <div class="cal-nav">
                        <button id="prevMonthBtn">‹</button>
                        <span id="calMonthYear">September 2026</span>
                        <button id="nextMonthBtn">›</button>
                    </div>
                    <div class="cal-weekdays" id="calWeekdaysContainer">
                        <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
                    </div>
                    <div class="cal-grid" id="calGrid"></div>
                    <div class="cal-footer">
                        <button id="calTodayBtn">Today</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=9"></script>
</body>
</html>
