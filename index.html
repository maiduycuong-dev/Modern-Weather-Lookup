<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather Lookup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <div class="header-container">
            <h2>⛅ Modern Weather Lookup</h2>
            <button id="settingsBtn">⚙️</button>
        </div>

        <div class="settings-panel hidden" id="settingsPanel">
            <h4>Background Theme</h4>
            <div class="theme-options">
                <button class="theme-btn" data-theme="blue" style="background: linear-gradient(135deg, #00c6ff, #0072ff);"></button>
                <button class="theme-btn" data-theme="sunset" style="background: linear-gradient(135deg, #f857a6, #ff5858);"></button>
                <button class="theme-btn" data-theme="emerald" style="background: linear-gradient(135deg, #11998e, #38ef7d);"></button>
                <button class="theme-btn" data-theme="dark" style="background: linear-gradient(135deg, #232526, #414345);"></button>
            </div>

            <h4 style="margin-top: 15px;">Interface Font</h4>
            <div class="font-options">
                <button class="font-btn active" data-font="Segoe UI">Segoe UI</button>
                <button class="font-btn" data-font="Roboto">Roboto</button>
                <button class="font-btn" data-font="Inter">Inter</button>
                <button class="font-btn" data-font="Arial">Arial</button>
            </div>

            <h4 style="margin-top: 15px;">Temperature Unit</h4>
            <div class="unit-options">
                <button class="unit-btn active" data-unit="C">°C</button>
                <button class="unit-btn" data-unit="F">°F</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <div id="loadingMsg" class="loading hidden">⏳ Loading weather data...</div>
        <div id="errorMsg" class="error hidden">City not found! Please try again!</div>

        <div id="weatherResult" class="hidden">
            <h2 id="cityName"></h2>
            <span id="localTime" class="local-time"></span>
            
            <div class="temp-box">
                <span id="temp"></span><span id="unitSymbol" class="unit">°C</span>
            </div>
            
            <p id="description"></p>
            
            <div class="details">
                <div>💧 Humid: <span id="humidity"></span>%</div>
                <div>💨 Wind: <span id="wind"></span> km/h</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
