<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Weather Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500;700&family=Lato:wght@400;700&family=Outfit:wght@400;500;600&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">

    <button id="floatingToggleBtn" class="floating-toggle-btn">🌤️</button>

    <div class="weather-card floating-widget hidden" id="weatherCard">
        <div class="header-container">
            <h2 id="cardTitle">Weather Widget</h2>
            <div class="header-actions">
                <button id="settingsBtn" title="Settings">⚙️</button>
                <button id="closeWidgetBtn" title="Close">✕</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="history-trigger-box">
            <button id="historyModalBtn" class="history-trigger-btn">📅 Today</button>
        </div>
        
        <div id="hourSelectorBox" class="hour-selector-box hidden">
            <div class="hour-selector-header">
                <span id="labelHourSelect">Select Hour:</span>
                <span id="selectedHourDisplay" class="selected-hour-badge">12:00</span>
            </div>
            <div class="hour-grid" id="hourGrid"></div>
        </div>

        <div id="loadingMsg" class="loading hidden">Loading...</div>
        <div id="errorMsg" class="error hidden">Error!</div>

        <div id="weatherResult" class="hidden">
            <div id="cityName" style="font-size: 20px; font-weight: 600; color: #111; margin-bottom: 5px;"></div>
            <span id="localTime" class="local-time"></span>
            
            <div class="temp-box">
                <span id="temp">--</span><span class="unit" id="unitSymbol">°C</span>
            </div>
            
            <div id="description">--</div>
            
            <div class="details">
                <div><span id="labelHumidity">Humidity</span>: <span id="humidity">--</span>%</div>
                <div><span id="labelWind">Wind</span>: <span id="wind">--</span> m/s</div>
                <div><span id="labelUV">UV Index</span>: <span id="uvIndex">--</span></div>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="labelSettingsTitle">Settings</h3>
                <button class="close-modal-btn" id="closeSettingsBtn">✕</button>
            </div>
            
            <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
                <div class="setting-group" style="margin-bottom: 15px;">
                    <h4 id="labelTheme">Background Theme</h4>
                    <div class="theme-options">
                        <button class="theme-btn active" data-theme="default" style="background: rgba(255, 255, 255, 0.95);"></button>
                        <button class="theme-btn" data-theme="blue" style="background: linear-gradient(135deg, #00c6ff, #0072ff);"></button>
                        <button class="theme-btn" data-theme="sunset" style="background: linear-gradient(135deg, #f857a6, #ff5858);"></button>
                        <button class="theme-btn" data-theme="emerald" style="background: linear-gradient(135deg, #11998e, #38ef7d);"></button>
                        <button class="theme-btn" data-theme="crimson" style="background: linear-gradient(135deg, #ff416c, #ff4b2b);"></button>
                        <button class="theme-btn" data-theme="dark" style="background: linear-gradient(135deg, #232526, #414345);"></button>
                    </div>
                </div>

                <div class="setting-group" style="margin-bottom: 15px;">
                    <h4 id="labelGlass">Glass Effect</h4>
                    <div class="glass-slider-box">
                        <input type="range" id="glassSlider" min="10" max="60" value="30" step="5">
                    </div>
                </div>

                <div class="setting-group" style="margin-bottom: 15px;">
                    <h4 id="labelFont">Fonts Theme</h4>
                    <div class="font-options">
                        <button class="font-btn active" data-font="segoe">Segoe UI</button>
                        <button class="font-btn" data-font="inter">Inter</button>
                        <button class="font-btn" data-font="roboto">Roboto</button>
                        <button class="font-btn" data-font="lato">Lato</button>
                        <button class="font-btn" data-font="outfit">Outfit</button>
                        <button class="font-btn" data-font="quicksand">Quicksand</button>
                    </div>
                </div>

                <div class="setting-group" style="margin-bottom: 15px;">
                    <h4 id="labelUnit">Temperature Unit</h4>
                    <div class="unit-options">
                        <button class="unit-btn active" data-unit="C">°C</button>
                        <button class="unit-btn" data-unit="F">°F</button>
                        <button class="unit-btn" data-unit="K">K</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="labelHistoryTitle">Select Date</h3>
                <button class="close-modal-btn" id="closeHistoryBtn">✕</button>
            </div>
            
            <div class="modal-body">
                <div class="custom-calendar">
                    <div class="cal-nav">
                        <button id="prevMonthBtn">‹</button>
                        <span id="calMonthYear">September 2026</span>
                        <button id="nextMonthBtn">›</button>
                    </div>
                    <div class="cal-weekdays" id="calWeekdaysContainer"></div>
                    <div class="cal-grid" id="calGrid"></div>
                    <div class="cal-footer">
                        <button id="calTodayBtn">Today</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
