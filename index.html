<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material You Weather</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="m3-workspace">
        <section class="m3-card search-card">
            <div class="m3-textfield">
                <input type="text" id="cityInput" placeholder="Nhập tên thành phố...">
                <button id="searchBtn" class="m3-button">Tìm kiếm</button>
            </div>
            <div id="loadingMsg" class="m3-status hidden">Đang tải...</div>
            <div id="errorMsg" class="m3-status error hidden"></div>
        </section>

        <section class="m3-card history-card">
            <button id="historyModalBtn" class="m3-button tonal">📅 Chọn ngày & giờ</button>
            <div id="hourSelectorBox" class="hour-container hidden">
                <div class="hour-header">
                    <span>Chọn giờ:</span>
                    <span id="selectedHourDisplay" class="badge">12:00</span>
                </div>
                <div class="hour-grid" id="hourGrid"></div>
            </div>
        </section>

        <section class="m3-card temp-card">
            <div class="temp-header">
                <span id="cityName" class="city-label">Chưa chọn thành phố</span>
                <span id="localTime" class="time-label">--</span>
            </div>
            <div class="temp-body">
                <span id="temp">--</span><span id="unitSymbol">°C</span>
            </div>
            <div id="description" class="desc-label">--</div>
            <div class="unit-row">
                <button class="m3-chip active" data-unit="C">°C</button>
                <button class="m3-chip" data-unit="F">°F</button>
                <button class="m3-chip" data-unit="K">K</button>
            </div>
        </section>

        <section class="m3-card details-card">
            <div class="metric-item">
                <span class="metric-title">Độ ẩm</span>
                <strong id="humidity" class="metric-value">--%</strong>
            </div>
            <div class="metric-item">
                <span class="metric-title">Tốc độ gió</span>
                <strong id="wind" class="metric-value">-- m/s</strong>
            </div>
            <div class="metric-item">
                <span class="metric-title">Chỉ số UV</span>
                <strong id="uvIndex" class="metric-value">--</strong>
            </div>
        </section>
    </main>

    <div id="historyModal" class="m3-modal hidden">
        <div class="m3-dialog">
            <div class="dialog-header">
                <h3>Chọn ngày lịch sử</h3>
                <button id="closeHistoryBtn" class="icon-btn">✕</button>
            </div>
            <div class="calendar-container">
                <div class="cal-nav">
                    <button id="prevMonthBtn" class="icon-btn">‹</button>
                    <span id="calMonthYear"></span>
                    <button id="nextMonthBtn" class="icon-btn">›</button>
                </div>
                <div class="cal-weekdays">
                    <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
                </div>
                <div class="cal-grid" id="calGrid"></div>
                <button id="calTodayBtn" class="m3-button tonal full-width">Hôm nay</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
