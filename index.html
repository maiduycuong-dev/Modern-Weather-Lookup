<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Checking Now</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="workspace">
        <div class="widget" id="inputWidget">
            <h3>1. Widget Điền Chữ</h3>
            <div class="input-group">
                <input type="text" id="cityInput" placeholder="Nhập tên thành phố...">
                <button id="searchBtn">Tìm</button>
            </div>
            <div id="loadingMsg" class="msg hidden">Đang tải...</div>
            <div id="errorMsg" class="msg error hidden"></div>
        </div>

        <div class="widget" id="historyWidget">
            <h3>2. Widget Chọn Lịch Sử & Giờ</h3>
            <button id="historyModalBtn" class="btn-full">📅 Chọn Ngày: Hôm nay</button>
            <div id="hourSelectorBox" class="hour-box hidden">
                <div class="hour-header">
                    <span>Chọn Giờ:</span>
                    <span id="selectedHourDisplay" class="badge">12:00</span>
                </div>
                <div class="hour-grid" id="hourGrid"></div>
            </div>
        </div>

        <div class="widget" id="tempWidget">
            <h3>3. Widget Nhiệt Độ</h3>
            <div id="cityName" class="city-title">Chưa chọn thành phố</div>
            <div id="localTime" class="time-tag">--</div>
            <div class="temp-display">
                <span id="temp">--</span><span id="unitSymbol">°C</span>
            </div>
            <div id="description">--</div>
            <div class="unit-row">
                <button class="unit-btn active" data-unit="C">°C</button>
                <button class="unit-btn" data-unit="F">°F</button>
                <button class="unit-btn" data-unit="K">K</button>
            </div>
        </div>

        <div class="widget" id="detailsWidget">
            <h3>4. Widget Thông Số</h3>
            <div class="stat-card">
                <span>Độ ẩm</span>
                <strong id="humidity">--%</strong>
            </div>
            <div class="stat-card">
                <span>Tốc độ gió</span>
                <strong id="wind">-- m/s</strong>
            </div>
            <div class="stat-card">
                <span>Chỉ số UV</span>
                <strong id="uvIndex">--</strong>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-top">
                <h4>Chọn Ngày</h4>
                <button id="closeHistoryBtn">✕</button>
            </div>
            <div class="calendar">
                <div class="cal-nav">
                    <button id="prevMonthBtn">‹</button>
                    <span id="calMonthYear"></span>
                    <button id="nextMonthBtn">›</button>
                </div>
                <div class="cal-weekdays">
                    <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
                </div>
                <div class="cal-grid" id="calGrid"></div>
                <button id="calTodayBtn" class="btn-full" style="margin-top: 10px;">Hôm nay</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
