<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather Lookup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <div class="header-container">
            <h2>🌤️ Weather Lookup</h2>
            <button id="settingsBtn" title="Theme Settings">⚙️</button>
        </div>

        <div id="settingsPanel" class="settings-panel hidden">
            <h4>Background Theme</h4>
            <div class="theme-options">
                <button class="theme-btn" data-theme="blue" style="background: linear-gradient(135deg, #00c6ff, #0072ff);"></button>
                <button class="theme-btn" data-theme="sunset" style="background: linear-gradient(135deg, #f857a6, #ff5858);"></button>
                <button class="theme-btn" data-theme="emerald" style="background: linear-gradient(135deg, #11998e, #38ef7d);"></button>
                <button class="theme-btn" data-theme="dark" style="background: linear-gradient(135deg, #232526, #414345);"></button>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter the name of the area to search...">
            <button id="searchBtn">Search</button>
        </div>
        <p id="loadingMsg" class="loading hidden">⏳ Searching for weather information...</p>

        <div id="weatherResult" class="hidden">
            <h3 id="cityName">City Name</h3>

            <div id="localTime" class="local-time">🕒 --:--:-- (--/--/----)</div>

            <div class="temp-box">
                <span id="temp">--</span><span class="unit">°C</span>
            </div>
            <p id="description">Sky and Clouds</p>
            <div class="details">
                <p>💧 Humid: <span id="humidity">--</span>%</p>
                <p>💨 Wind: <span id="wind">--</span> km/h</p>
            </div>
        </div>

        <p id="errorMsg" class="error hidden">This city was not found!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
